[project]
name = "automated-data-quality-monitoring-pipeline"
version = "0.1.0"
description = "Automated Data Quality Monitoring Pipeline"
requires-python = ">=3.11,<3.13"
dependencies = [
    "pandas>=2.0.0",
    "requests>=2.28.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.23.0",
    "sqlalchemy>=2.0.0",
    "pymysql>=1.1.0"
]

[tool.vercel]
entrypoint = "src.api:app"